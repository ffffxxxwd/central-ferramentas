<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas</title>
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="overlay" id="overlay"></div>

  <!-- Menu lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h3.8l1.7 2h6.5A1.5 1.5 0 0 1 18 9.5v7A1.5 1.5 0 0 1 16.5 18h-12A1.5 1.5 0 0 1 3 16.5z"/>
          <path d="M7 6V4.5A1.5 1.5 0 0 1 8.5 3h3.8l1.7 2h6.5A1.5 1.5 0 0 1 22 6.5v7a1.5 1.5 0 0 1-1.5 1.5H18"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Central de Ferramentas</span>
        <span class="brand-sub">Área de trabalho</span>
      </div>
    </div>

    <nav class="menu" id="menu"><!-- gerado automaticamente --></nav>

    <div class="sidebar-footer">
      <span class="version">v1.0</span>
    </div>
  </aside>

  <!-- Área principal -->
  <main class="content">
    <header class="topbar">
      <div class="topbar-title" id="topbarTitle">Início</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <section class="view" id="view"><!-- home ou ferramenta --></section>
  </main>

  <script src="assets/js/icones.js?v=1"></script>
  <script src="assets/js/tools.js?v=4"></script>
  <script src="assets/js/app.js?v=2"></script>
</body>
</html>
