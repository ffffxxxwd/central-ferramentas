<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
  <div class="overlay" id="overlay"></div>

  <!-- Menu lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🗂️</div>
      <div class="brand-text">
        <span class="brand-name">Central de Ferramentas</span>
        <span class="brand-sub">Área de trabalho</span>
      </div>
    </div>

    <nav class="menu" id="menu"><!-- gerado automaticamente --></nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle">
        <span class="theme-icon">🌙</span>
        <span class="theme-label">Tema escuro</span>
      </button>
      <span class="version">v1.0</span>
    </div>
  </aside>

  <!-- Área principal -->
  <main class="content">
    <header class="topbar">
      <div class="topbar-title" id="topbarTitle">Início</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <section class="view" id="view"><!-- home ou ferramenta --></section>
  </main>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/tools.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
