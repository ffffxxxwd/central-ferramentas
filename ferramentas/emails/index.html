<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modelos de Email</title>
  <link rel="stylesheet" href="css/style.css?v=1" />
</head>
<body>
  <div class="app">
    <header class="topo">
      <div>
        <h1>Modelos de Email</h1>
        <p class="sub">Escolha um modelo, preencha os campos e copie o conteúdo pronto.</p>
      </div>
    </header>

    <div class="conteudo">
      <!-- Lista de modelos -->
      <aside class="lista">
        <h2>Modelos</h2>
        <ul id="listaModelos"></ul>
      </aside>

      <!-- Editor + Preview -->
      <section class="editor" id="editor">
        <div class="editor-vazio" id="vazio">Selecione um modelo à esquerda.</div>
      </section>
    </div>
  </div>

  <script src="js/modelos.js?v=2"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
