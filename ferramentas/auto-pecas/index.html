<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Peças</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f7fc;color:#17203a;padding:24px;max-width:800px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:20px;font-weight:600}

/* Cards resumo */
.resumo{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card{flex:1;min-width:120px;background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-label{font-size:.7rem;color:#6b7690;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card-valor{font-size:1.2rem;font-weight:700}
.card-valor.positivo{color:#17b26a}
.card-valor.negativo{color:#e03131}
.card-valor.saldo{color:#3160f5}

/* Info do período */
.periodo-info{font-size:.78rem;color:#6b7690;margin:-8px 0 16px;padding:0 2px}
.periodo-info b{color:#17203a;font-weight:600}

/* Período tabs */
.periodo-tabs{display:flex;gap:4px;margin-bottom:16px;background:#fff;border-radius:10px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.periodo-tab{flex:1;text-align:center;padding:8px 12px;border:none;background:none;border-radius:8px;font-size:.8rem;font-weight:500;color:#6b7690;cursor:pointer;transition:all .15s}
.periodo-tab.ativo{background:#3160f5;color:#fff}
.periodo-tab:hover:not(.ativo){background:#f0f2f7}

/* Navegação período */
.periodo-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.periodo-nav button{background:none;border:1px solid #e3e8f2;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem;color:#17203a}
.periodo-nav button:hover{border-color:#3160f5;color:#3160f5}
.periodo-nav span{font-size:.9rem;font-weight:600;min-width:180px;text-align:center}

/* Resumo do período */
.periodo-resumo{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.periodo-card{flex:1;min-width:100px;background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.periodo-card .pc-label{font-size:.7rem;color:#6b7690;text-transform:uppercase;letter-spacing:.4px}
.periodo-card .pc-valor{font-size:1.05rem;font-weight:700;margin-top:2px}

/* Form */
.form-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.form-row input,.form-row select{flex:1;min-width:120px;padding:10px 12px;border:1px solid #e3e8f2;border-radius:8px;font-size:.9rem;background:#fff;color:#17203a}
.form-row input:focus,.form-row select:focus{outline:none;border-color:#3160f5}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-add{background:#3160f5;color:#fff}.btn-add:hover{background:#244ed6}
.btn-del{background:none;border:none;color:#e03131;cursor:pointer;font-size:.85rem;padding:4px 8px;border-radius:6px}
.btn-del:hover{background:#ffeaea}

/* Filtros */
.filtros{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filtros select,.filtros input{padding:8px 10px;border:1px solid #e3e8f2;border-radius:8px;font-size:.85rem;background:#fff;color:#17203a}
.btn-limpar{font-size:.8rem;color:#6b7690;background:none;border:1px solid #e3e8f2;border-radius:8px;padding:6px 12px;cursor:pointer}
.btn-limpar:hover{border-color:#3160f5;color:#3160f5}
.btn-export{font-size:.8rem;color:#6b7690;background:none;border:1px solid #e3e8f2;border-radius:8px;padding:6px 12px;cursor:pointer;margin-left:auto}
.btn-export:hover{border-color:#3160f5;color:#3160f5}

/* Tabela */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
th{text-align:left;padding:12px 14px;font-size:.75rem;color:#6b7690;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e3e8f2}
td{padding:10px 14px;font-size:.9rem;border-bottom:1px solid #f0f2f7}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:600}
.tag-receita{background:#e6f9ef;color:#17b26a}
.tag-gasto{background:#ffeaea;color:#e03131}
.vazio{text-align:center;padding:40px;color:#6b7690}

/* Separador de dia */
.dia-header td{background:#f5f7fc;font-weight:700;font-size:.8rem;color:#3160f5;padding:8px 14px;border-bottom:1px solid #e3e8f2}
.dia-subtotal td{background:#fafbfe;font-size:.8rem;color:#6b7690;padding:6px 14px;border-bottom:2px solid #e3e8f2;font-weight:600}
</style>
</head>
<body>

<h1>Auto Peças</h1>

<!-- Cards gerais -->
<div class="resumo">
  <div class="card"><div class="card-label">Receitas</div><div class="card-valor positivo" id="totalReceitas">R$ 0,00</div></div>
  <div class="card"><div class="card-label">Gastos</div><div class="card-valor negativo" id="totalGastos">R$ 0,00</div></div>
  <div class="card"><div class="card-label">Lucro</div><div class="card-valor saldo" id="saldo">R$ 0,00</div></div>
  <div class="card"><div class="card-label">Cada (÷2)</div><div class="card-valor saldo" id="saldoMetade">R$ 0,00</div></div>
</div>

<div class="periodo-info" id="periodoInfo"></div>

<!-- Tabs de período -->
<div class="periodo-tabs">
  <button class="periodo-tab ativo" onclick="setPeriodo('tudo')">Tudo</button>
  <button class="periodo-tab" onclick="setPeriodo('7d')">7 dias</button>
  <button class="periodo-tab" onclick="setPeriodo('15d')">15 dias</button>
  <button class="periodo-tab" onclick="setPeriodo('30d')">30 dias</button>
  <button class="periodo-tab" onclick="setPeriodo('dia')">Hoje</button>
  <button class="periodo-tab" onclick="setPeriodo('ontem')">Ontem</button>
  <button class="periodo-tab" onclick="setPeriodo('semana')">Semanal</button>
  <button class="periodo-tab" onclick="setPeriodo('mes')">Mensal</button>
  <button class="periodo-tab" onclick="setPeriodo('ano')">Anual</button>
  <span style="display:inline-flex;align-items:center;gap:4px;margin-left:4px">
    <input type="number" id="diasCustom" min="1" max="365" placeholder="X" onkeydown="if(event.key==='Enter')setPeriodoCustom()" style="width:50px;padding:6px 8px;border:1px solid #e3e8f2;border-radius:8px;font-size:.8rem;text-align:center">
    <button class="periodo-tab" id="btnDias" onclick="setPeriodoCustom()">dias</button>
  </span>
</div>

<!-- Navegação do período -->
<div class="periodo-nav" id="periodoNav" style="display:none">
  <button onclick="navPeriodo(-1)">&larr;</button>
  <span id="periodoLabel">-</span>
  <button onclick="navPeriodo(1)">&rarr;</button>
</div>

<!-- Formulário -->
<div class="form-row">
  <input type="text" id="descricao" placeholder="Descrição">
  <input type="number" id="valor" placeholder="Valor" step="0.01" min="0">
  <select id="tipo"><option value="gasto">Gasto</option><option value="receita">Receita</option></select>
  <select id="categoria">
    <option value="">Categoria</option>
    <option>Trabalho</option><option>Campanha</option><option>Outros</option>
  </select>
  <input type="date" id="data">
  <button class="btn btn-add" onclick="adicionar()">Adicionar</button>
</div>

<!-- Filtros -->
<div class="filtros">
  <select id="filtroTipo" onchange="renderizar()">
    <option value="">Todos</option><option value="receita">Receitas</option><option value="gasto">Gastos</option>
  </select>
  <select id="filtroCategoria" onchange="renderizar()">
    <option value="">Todas categorias</option>
  </select>
  <button class="btn-limpar" onclick="limparFiltros()">Limpar filtros</button>
  <button class="btn-export" onclick="exportarImagem()">Compartilhar</button>
  <button class="btn-export" onclick="exportarCSV()">CSV</button>
</div>

<table>
  <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead>
  <tbody id="tabela"></tbody>
</table>

<script>
const CHAVE = 'auto_pecas_v1';

// Lançamentos fixos (adicionados via código)
const FIXOS = [
  { id: 1, desc: 'Primeira entrada (bruto)', valor: 620, tipo: 'receita', cat: 'Trabalho', data: '2026-10-07' },
  { id: 2, desc: 'Custo primeira entrada', valor: 120, tipo: 'gasto', cat: 'Trabalho', data: '2026-10-07' },
];

let periodoAtual = 'tudo';
let offsetPeriodo = 0;

function carregarLocal() {
  try { return JSON.parse(localStorage.getItem(CHAVE)) || []; }
  catch { return []; }
}

function carregar() {
  const locais = carregarLocal();
  const idsLocais = new Set(locais.map(e => e.id));
  const removidos = new Set(JSON.parse(localStorage.getItem(CHAVE + '_rem')) || []);
  const fixosFiltrados = FIXOS.filter(e => !idsLocais.has(e.id) && !removidos.has(e.id));
  return [...fixosFiltrados, ...locais];
}

function salvar(lista) { localStorage.setItem(CHAVE, JSON.stringify(lista)); }

function fmt(v) { return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

function fmtData(d) {
  if (!d) return '-';
  const [a, m, dia] = d.split('-');
  return dia + '/' + m + '/' + a;
}

const DIAS_SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function fmtDiaCompleto(d) {
  const dt = new Date(d + 'T12:00:00');
  return DIAS_SEMANA[dt.getDay()] + ', ' + dt.getDate() + ' de ' + MESES[dt.getMonth()];
}

// Data local em AAAA-MM-DD (toISOString converte pra UTC e vira o dia seguinte após 21h)
function iso(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

// Período
function getInicioSemana(date) {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  return iso(d);
}

function getRangePeriodo() {
  const hoje = new Date();
  let inicio, fim, label;

  if (periodoAtual.endsWith('d') && periodoAtual !== 'dia') {
    const dias = parseInt(periodoAtual);
    const fim_d = new Date(hoje);
    const ini_d = new Date(hoje);
    ini_d.setDate(ini_d.getDate() - dias + 1);
    inicio = iso(ini_d);
    fim = iso(fim_d);
    label = 'Últimos ' + dias + ' dias';
  } else if (periodoAtual === 'dia' || periodoAtual === 'ontem') {
    const d = new Date(hoje);
    d.setDate(d.getDate() + offsetPeriodo + (periodoAtual === 'ontem' ? -1 : 0));
    const ds = iso(d);
    inicio = ds; fim = ds;
    label = fmtDiaCompleto(ds);
  } else if (periodoAtual === 'semana') {
    const d = new Date(hoje);
    d.setDate(d.getDate() + offsetPeriodo * 7);
    const seg = new Date(d);
    seg.setDate(seg.getDate() - seg.getDay() + 1);
    const dom = new Date(seg);
    dom.setDate(dom.getDate() + 6);
    inicio = iso(seg);
    fim = iso(dom);
    label = fmtData(inicio) + ' — ' + fmtData(fim);
  } else if (periodoAtual === 'mes') {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() + offsetPeriodo, 1);
    const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    inicio = iso(d);
    fim = iso(ultimo);
    label = MESES[d.getMonth()] + ' ' + d.getFullYear();
  } else if (periodoAtual === 'ano') {
    const d = new Date(hoje.getFullYear() + offsetPeriodo, 0, 1);
    const ultimo = new Date(d.getFullYear(), 11, 31);
    inicio = iso(d);
    fim = iso(ultimo);
    label = '' + d.getFullYear();
  }
  return { inicio, fim, label };
}

function setPeriodo(p) {
  periodoAtual = p;
  offsetPeriodo = 0;
  document.getElementById('diasCustom').value = '';
  document.querySelectorAll('.periodo-tab').forEach(t => t.classList.remove('ativo'));
  const btn = document.querySelector(`.periodo-tab[onclick="setPeriodo('${p}')"]`);
  if (btn) btn.classList.add('ativo');
  renderizar();
}

function setPeriodoCustom() {
  const input = document.getElementById('diasCustom');
  const dias = parseInt(input.value);
  if (!dias || dias < 1) { alert('Digite a quantidade de dias.'); return; }
  document.querySelectorAll('.periodo-tab').forEach(t => t.classList.remove('ativo'));
  document.getElementById('btnDias').classList.add('ativo');
  periodoAtual = dias + 'd';
  offsetPeriodo = 0;
  renderizar();
}

function navPeriodo(dir) {
  offsetPeriodo += dir;
  renderizar();
}

function adicionar() {
  const desc = document.getElementById('descricao').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  const tipo = document.getElementById('tipo').value;
  const cat = document.getElementById('categoria').value || 'Outros';
  const data = document.getElementById('data').value || iso(new Date());

  if (!desc || isNaN(valor) || valor <= 0) { alert('Preencha descrição e valor.'); return; }

  const lista = carregar();
  lista.push({ id: Date.now(), desc, valor, tipo, cat, data });
  salvar(lista);

  document.getElementById('descricao').value = '';
  document.getElementById('valor').value = '';
  document.getElementById('categoria').value = '';
  renderizar();
}

function remover(id) {
  if (FIXOS.some(e => e.id === id)) {
    const rem = JSON.parse(localStorage.getItem(CHAVE + '_rem')) || [];
    rem.push(id);
    localStorage.setItem(CHAVE + '_rem', JSON.stringify(rem));
  }
  const lista = carregarLocal().filter(e => e.id !== id);
  salvar(lista);
  renderizar();
}

function filtrar() {
  let lista = carregar();
  const tipo = document.getElementById('filtroTipo').value;
  const cat = document.getElementById('filtroCategoria').value;

  if (tipo) lista = lista.filter(e => e.tipo === tipo);
  if (cat) lista = lista.filter(e => e.cat === cat);

  // filtro por período
  if (periodoAtual !== 'tudo') {
    const { inicio, fim } = getRangePeriodo();
    lista = lista.filter(e => e.data && e.data >= inicio && e.data <= fim);
  }

  return lista;
}

function renderizar() {
  const todos = carregar();
  const lista = filtrar();

  // totais baseados no período selecionado
  const fonte = lista;
  const receitasTotal = fonte.filter(e => e.tipo === 'receita').reduce((s, e) => s + e.valor, 0);
  const gastosTotal = fonte.filter(e => e.tipo === 'gasto').reduce((s, e) => s + e.valor, 0);

  document.getElementById('totalReceitas').textContent = fmt(receitasTotal);
  document.getElementById('totalGastos').textContent = fmt(gastosTotal);
  const saldoEl = document.getElementById('saldo');
  const saldoVal = receitasTotal - gastosTotal;
  saldoEl.textContent = fmt(Math.abs(saldoVal));
  if (saldoVal < 0) { saldoEl.textContent = '- ' + saldoEl.textContent; saldoEl.className = 'card-valor negativo'; }
  else { saldoEl.className = 'card-valor saldo'; }

  const metadeEl = document.getElementById('saldoMetade');
  const metade = saldoVal / 2;
  metadeEl.textContent = fmt(Math.abs(metade));
  if (metade < 0) { metadeEl.textContent = '- ' + metadeEl.textContent; metadeEl.className = 'card-valor negativo'; }
  else { metadeEl.className = 'card-valor saldo'; }

  // linha de info: de quando ate quando esses numeros vem
  const infoEl = document.getElementById('periodoInfo');
  const datas = fonte.map(e => e.data).filter(Boolean).sort();
  if (!datas.length) {
    infoEl.textContent = '';
  } else {
    const ini = datas[0], fimD = datas[datas.length - 1];
    const diasCorridos = Math.round((new Date(fimD + 'T12:00:00') - new Date(ini + 'T12:00:00')) / 86400000) + 1;
    const diasComLancamento = new Set(datas).size;
    const escopo = periodoAtual === 'tudo' ? 'Tudo' : getRangePeriodo().label;
    infoEl.innerHTML = escopo + ': de <b>' + fmtData(ini) + '</b> a <b>' + fmtData(fimD) + '</b>'
      + ' · ' + diasCorridos + (diasCorridos === 1 ? ' dia' : ' dias')
      + ' · ' + diasComLancamento + (diasComLancamento === 1 ? ' dia com movimento' : ' dias com movimento')
      + ' · ' + fonte.length + (fonte.length === 1 ? ' lançamento' : ' lançamentos');
  }

  // nav do período
  const navEl = document.getElementById('periodoNav');
  const isRapido = periodoAtual.endsWith('d') && periodoAtual !== 'dia';
  if (periodoAtual !== 'tudo') {
    const { label } = getRangePeriodo();
    navEl.style.display = isRapido ? 'none' : 'flex';
    document.getElementById('periodoLabel').textContent = label;
  } else {
    navEl.style.display = 'none';
  }

  // categorias no filtro
  const cats = [...new Set(todos.map(e => e.cat).filter(Boolean))].sort();
  const selCat = document.getElementById('filtroCategoria');
  const catAtual = selCat.value;
  selCat.innerHTML = '<option value="">Todas categorias</option>' + cats.map(c => `<option${c === catAtual ? ' selected' : ''}>${c}</option>`).join('');

  // tabela agrupada por dia
  const tbody = document.getElementById('tabela');
  if (!lista.length) { tbody.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum lançamento neste período.</td></tr>'; return; }

  lista.sort((a, b) => (b.data || '').localeCompare(a.data || '') || b.id - a.id);

  // agrupar por data
  const grupos = {};
  lista.forEach(e => {
    const d = e.data || 'sem-data';
    if (!grupos[d]) grupos[d] = [];
    grupos[d].push(e);
  });

  const diasOrdenados = Object.keys(grupos).sort((a, b) => b.localeCompare(a));

  let html = '';
  diasOrdenados.forEach(dia => {
    const itens = grupos[dia];
    const recDia = itens.filter(e => e.tipo === 'receita').reduce((s, e) => s + e.valor, 0);
    const gasDia = itens.filter(e => e.tipo === 'gasto').reduce((s, e) => s + e.valor, 0);
    const lucroDia = recDia - gasDia;

    html += `<tr class="dia-header"><td colspan="6">${dia === 'sem-data' ? 'Sem data' : fmtDiaCompleto(dia)}</td></tr>`;

    itens.forEach(e => {
      html += `<tr>
        <td>${fmtData(e.data)}</td>
        <td>${e.desc}</td>
        <td>${e.cat || '-'}</td>
        <td><span class="tag tag-${e.tipo}">${e.tipo === 'receita' ? 'Receita' : 'Gasto'}</span></td>
        <td style="font-weight:600;color:${e.tipo === 'receita' ? '#17b26a' : '#e03131'}">${e.tipo === 'gasto' ? '- ' : ''}${fmt(e.valor)}</td>
        <td><button class="btn-del" onclick="remover(${e.id})">remover</button></td>
      </tr>`;
    });

    const metadeDia = lucroDia / 2;
    html += `<tr class="dia-subtotal">
      <td colspan="6" style="padding:8px 14px">
        <span>Bruto: <b style="color:#17b26a">${fmt(recDia)}</b></span>
        <span style="margin-left:16px">Custo: <b style="color:#e03131">${fmt(gasDia)}</b></span>
        <span style="margin-left:16px">Lucro: <b style="color:${lucroDia >= 0 ? '#3160f5' : '#e03131'}">${lucroDia < 0 ? '- ' : ''}${fmt(Math.abs(lucroDia))}</b></span>
        <span style="margin-left:16px">Cada: <b style="color:${metadeDia >= 0 ? '#3160f5' : '#e03131'}">${metadeDia < 0 ? '- ' : ''}${fmt(Math.abs(metadeDia))}</b></span>
      </td>
    </tr>`;
  });

  tbody.innerHTML = html;
}

function limparFiltros() {
  document.getElementById('filtroTipo').value = '';
  document.getElementById('filtroCategoria').value = '';
  renderizar();
}

function exportarCSV() {
  const lista = filtrar();
  if (!lista.length) { alert('Nada para exportar.'); return; }
  const linhas = ['Data;Descrição;Categoria;Tipo;Valor'];
  lista.forEach(e => linhas.push(`${e.data};${e.desc};${e.cat};${e.tipo};${e.valor.toFixed(2).replace('.', ',')}`));
  const blob = new Blob([linhas.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gastos_receitas.csv';
  a.click();
}

function exportarImagem() {
  const lista = filtrar();
  const todos = carregar();
  const c = document.createElement('canvas');
  const w = 600;
  const ctx = c.getContext('2d');

  // dados (já filtrados pelo período)
  const recTotal = lista.filter(e => e.tipo === 'receita').reduce((s, e) => s + e.valor, 0);
  const gasTotal = lista.filter(e => e.tipo === 'gasto').reduce((s, e) => s + e.valor, 0);
  const lucTotal = recTotal - gasTotal;

  // agrupar por dia
  const grupos = {};
  lista.forEach(e => { const d = e.data || 'sem-data'; if (!grupos[d]) grupos[d] = []; grupos[d].push(e); });
  const dias = Object.keys(grupos).sort((a, b) => b.localeCompare(a));

  // calcular altura
  let h = 180; // header + totais
  dias.forEach(d => { h += 30 + grupos[d].length * 24 + 28; }); // dia header + itens + subtotal
  h += 20; // padding bottom

  c.width = w; c.height = h;
  ctx.fillStyle = '#f5f7fc'; ctx.fillRect(0, 0, w, h);

  // título
  let titulo = 'Gastos e Receitas';
  if (periodoAtual !== 'tudo') {
    const isRap = periodoAtual.endsWith('d') && periodoAtual !== 'dia';
    titulo += ' — ' + (isRap ? 'Últimos ' + parseInt(periodoAtual) + ' dias' : getRangePeriodo().label);
  }
  ctx.fillStyle = '#17203a'; ctx.font = 'bold 18px system-ui'; ctx.fillText(titulo, 24, 36);

  // totais gerais
  let y = 60;
  ctx.font = '11px system-ui'; ctx.fillStyle = '#6b7690';
  ctx.fillText('RECEITAS', 24, y); ctx.fillText('GASTOS', 168, y); ctx.fillText('LUCRO', 312, y); ctx.fillText('CADA (÷2)', 456, y);
  y += 20;
  ctx.font = 'bold 16px system-ui';
  ctx.fillStyle = '#17b26a'; ctx.fillText(fmt(recTotal), 24, y);
  ctx.fillStyle = '#e03131'; ctx.fillText(fmt(gasTotal), 168, y);
  ctx.fillStyle = '#3160f5'; ctx.fillText(fmt(lucTotal), 312, y);
  ctx.fillStyle = '#3160f5'; ctx.fillText(fmt(lucTotal / 2), 456, y);

  y += 30;

  // linha separadora
  ctx.strokeStyle = '#e3e8f2'; ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(w - 24, y); ctx.stroke(); y += 16;

  // dias
  dias.forEach(dia => {
    const itens = grupos[dia];
    const recD = itens.filter(e => e.tipo === 'receita').reduce((s, e) => s + e.valor, 0);
    const gasD = itens.filter(e => e.tipo === 'gasto').reduce((s, e) => s + e.valor, 0);
    const lucD = recD - gasD;

    ctx.fillStyle = '#3160f5'; ctx.font = 'bold 12px system-ui';
    ctx.fillText(dia === 'sem-data' ? 'Sem data' : fmtDiaCompleto(dia), 24, y); y += 20;

    itens.forEach(e => {
      ctx.font = '11px system-ui'; ctx.fillStyle = '#17203a';
      ctx.fillText(e.desc, 36, y);
      ctx.fillStyle = e.tipo === 'receita' ? '#17b26a' : '#e03131';
      ctx.fillText((e.tipo === 'gasto' ? '- ' : '') + fmt(e.valor), 420, y);
      y += 24;
    });

    ctx.font = '11px system-ui'; ctx.fillStyle = '#6b7690';
    ctx.fillText('Bruto: ' + fmt(recD) + '  Custo: ' + fmt(gasD) + '  Lucro: ' + fmt(lucD) + '  Cada: ' + fmt(lucD / 2), 36, y);
    y += 28;
  });

  // baixar
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'resumo_gastos.png';
  a.click();
}

// data padrão = hoje
document.getElementById('data').value = iso(new Date());
renderizar();
</script>
