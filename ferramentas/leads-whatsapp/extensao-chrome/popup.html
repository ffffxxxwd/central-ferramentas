<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;width:290px;margin:0;padding:15px;color:#1a1a1a;font-size:13.5px;}
  h1{font-size:15px;margin:0 0 4px;}
  .muted{color:#666;font-size:12px;line-height:1.45;}
  .row{display:flex;align-items:center;gap:8px;margin:12px 0;}
  .tot{font-weight:800;font-size:16px;}
  .btn{padding:8px 12px;border:1px solid #d6d6da;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;}
  .btn:hover{background:#f5f5f5;}
  .btn-p{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
  label.chk{display:flex;align-items:flex-start;gap:8px;cursor:pointer;line-height:1.4;}
  hr{border:none;border-top:1px solid #eee;margin:14px 0;}
</style>
</head>
<body>
  <h1>Leads do WhatsApp</h1>
  <div class="muted">O organizador fica num painel na lateral do WhatsApp Web (aba <b>CONTATOS</b>). Abra uma conversa e clique em <b>＋ Salvar</b>.</div>

  <div class="row">Contatos salvos: <span class="tot" id="tot">0</span></div>

  <div class="row">
    <label class="chk"><input type="checkbox" id="auto" /> Salvar automático ao abrir conversa de <b>número novo</b> (sem o formulário)</label>
  </div>

  <hr />
  <div class="row"><button class="btn btn-p" id="abrir">Abrir organizador em aba</button></div>
  <div class="muted">Se o painel não aparecer, recarregue a página do WhatsApp Web.</div>

  <script src="popup.js"></script>
</body>
</html>
